site_name: My Journey Through Vedanta
site_description: Personal study notes, reflections, and expanded understanding inspired by Vedanta Treatise by A. Parthasarathy

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber

nav:
  - Home: index.md
  - Preface:
      - Overview: preface/index.md
      - Living Is an Art: preface/living-is-an-art.md
      - Action and Inner Peace: preface/action-and-inner-peace.md
      - Practical Vedanta: preface/practical-vedanta.md
      - Path to Self-Realization: preface/path-to-self-realization.md
      - Essence of Vedanta: preface/essence-of-vedanta.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: >-
  <strong>Acknowledgement &amp; Gratitude</strong><br>
  With reverence and gratitude to Sri Shankaracharya; Sri A. Parthasarathy, author and teacher of Vedanta; and my teacher, the late <a href="https://www.vedantausa.org/teacher/" target="_blank" rel="noopener">Gautamji</a> of Vedanta USA in New York and New Jersey.<br><br>
  <strong>Disclaimer</strong><br>
  This is a personal study journal based on my handwritten notes and understanding of Vedanta. The notes have been organized, expanded, and presented with the assistance of artificial intelligence (AI). AI-generated explanations may contain errors or interpretations that do not precisely represent the original teachings. Readers are encouraged to study the original texts and teachings for authoritative understanding. This site is not affiliated with or an official publication of the authors, teachers, or organizations acknowledged above.
