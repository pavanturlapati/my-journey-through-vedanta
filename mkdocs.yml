site_name: My Journey Through Vedanta
site_url: https://vedanta.pavanturlapati.com/
site_description: Personal study notes, reflections, and expanded understanding inspired by Vedanta Treatise by A. Parthasarathy

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber

nav:
  - Home: index.md
  - Preface: preface/index.md
  - "Chapter 1 — Role of Vedanta":
      - Overview: chapter-01/index.md
      - Culmination of Knowledge: chapter-01/01-culmination-of-knowledge.md
      - Life as a Stream of Experiences: chapter-01/02-stream-of-experiences.md
      - Human Freedom and Right Action: chapter-01/03-freedom-and-right-action.md
      - Sanatana Dharma and the Divine Self: chapter-01/04-sanatana-dharma.md
      - Truth and Independent Thinking: chapter-01/05-truth-and-independent-thinking.md
      - Education over Rigidity: chapter-01/06-rigidity-and-education.md
      - Vedanta Must Be Practiced: chapter-01/07-practice-vedanta.md
      - Dynamic Living and the Faculty of Reason: chapter-01/09-reason-and-dynamic-living.md
      - Desire, the Self, and Dependence on the World: chapter-01/10-desire-self-and-worldly-dependence.md
      - Summary and Questions: chapter-01/08-summary-and-questions.md
  - Reflections:
      - Overview: reflections/index.md
      - Festivals:
          - "Navaratri 2026":
              - "Series Hub": reflections/navaratri.md
              - "Nine Nights, Two Ways of Understanding": reflections/navaratri-nine-nights-vedanta-and-tradition.md
              - "Day 1 — Shailaputri: What Is the Foundation of My Life?": reflections/navaratri-day-1-shailaputri-foundation.md
              - "Day 2 — Brahmacharini: What Does Steady Effort Look Like?": reflections/navaratri-day-2-brahmacharini-steady-effort.md
      - Personal Questions:
          - "Why Am I Going to the Temple?": reflections/2026-08-29-why-am-i-going-to-temple.md
          - "Who Is God?": reflections/2026-08-30-who-is-god.md
  - About This Study: about.md
  - Privacy: privacy.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/reflection-journal.js

extra:
  generator: false
  # Analytics and cookie banner. Google Analytics loads only after a visitor
  # clicks Accept. Cloudflare Web Analytics (cookie-free) is in overrides/.
  analytics:
    provider: google
    property: G-4D70KGSQWE
  consent:
    title: Cookie consent
    description: >-
      I use Google Analytics, only if you allow it, to see which pages are
      read. See the <a href="/privacy/">privacy page</a>.
    cookies:
      analytics: Google Analytics
    actions:
      - accept
      - reject

copyright: >-
  <span class="vedanta-footer"><strong>🙏 Acknowledgement &amp; Gratitude</strong> — With reverence to Sri Adi Shankaracharya, Sri A. Parthasarathy, and my teacher, the late <a href="https://www.vedantausa.org/teacher/" target="_blank" rel="noopener">Gautamji</a>. <a href="/about/#acknowledgement-gratitude">Read the full acknowledgement</a>.<br>
  <strong>AI-Assisted Study Disclaimer</strong> — This personal study journal is developed from handwritten notes with the assistance of AI and may contain errors or interpretations. <a href="/about/#ai-assisted-study-disclaimer">Read the full disclaimer</a>.<br>
    <a href="/privacy/">Privacy</a></span>
