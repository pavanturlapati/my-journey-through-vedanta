site_name: My Journey Through Vedanta
site_description: Personal study notes, reflections, and expanded understanding inspired by Vedanta Treatise by A. Parthasarathy

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber

nav:
  - Home: index.md
  - Preface: preface/index.md
  - About This Study: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: >-
  <span class="vedanta-footer"><strong>🙏 Acknowledgement &amp; Gratitude</strong> — With reverence to Sri Adi Shankaracharya, Sri A. Parthasarathy, and my teacher, the late <a href="https://www.vedantausa.org/teacher/" target="_blank" rel="noopener">Gautamji</a>. <a href="/my-journey-through-vedanta/about/#acknowledgement-gratitude">Read the full acknowledgement</a>.<br>
  <strong>AI-Assisted Study Disclaimer</strong> — This personal study journal is developed from handwritten notes with the assistance of AI and may contain errors or interpretations. <a href="/my-journey-through-vedanta/about/#ai-assisted-study-disclaimer">Read the full disclaimer</a>.</span>
