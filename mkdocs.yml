site_name: My Journey Through Vedanta
site_description: Personal study notes, reflections, and expanded understanding inspired by Vedanta Treatise by A. Parthasarathy

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber

nav:
  - Home: index.md
  - Preface:
      - Overview: preface/index.md
      - Living Is an Art: preface/living-is-an-art.md
      - Action and Inner Peace: preface/action-and-inner-peace.md
      - Practical Vedanta: preface/practical-vedanta.md
      - Path to Self-Realization: preface/path-to-self-realization.md
      - Essence of Vedanta: preface/essence-of-vedanta.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: >-
  <strong>Acknowledgement &amp; Gratitude</strong><br>
  With deep reverence and gratitude to <strong>Sri Adi Shankaracharya</strong>, one of the greatest teachers and exponents of Advaita Vedanta, whose teachings helped preserve, clarify, and transmit the profound wisdom of the Upanishads through generations.<br><br>
  My heartfelt gratitude to <strong>Sri A. Parthasarathy</strong>, whose lifetime of dedicated study, research, teaching, and exposition of Vedanta has made this timeless knowledge accessible to the modern world. His <em>Vedanta Treatise</em> forms the principal foundation and inspiration for this personal journey of study and reflection.<br><br>
  And with special gratitude to <strong>my teacher, the late <a href="https://www.vedantausa.org/teacher/" target="_blank" rel="noopener">Gautamji</a></strong> of Vedanta USA in New York and New Jersey, whose ability to explain profound Vedantic concepts in simple, practical, and relatable language enabled a lay student like me to begin understanding and applying these teachings in everyday life.<br><br>
  This study journal is offered with humility and gratitude to this great tradition of teachers through whom the knowledge of Vedanta continues to be shared from generation to generation.<br><br>
  <strong>Disclaimer</strong><br>
  This is a personal study journal based on my handwritten notes and understanding of Vedanta. The notes have been organized, expanded, and presented with the assistance of artificial intelligence (AI). AI-generated explanations may contain errors or interpretations that do not precisely represent the original teachings. Readers are encouraged to study the original texts and teachings for authoritative understanding. This site is not affiliated with or an official publication of the authors, teachers, or organizations acknowledged above.
